name: Source checks and ingestion

on:
  pull_request:
    paths: &ingestion-paths
      - '.github/workflows/ingestion.yml'
      - 'Sources/AviationMCP/Data/SourceChecks.swift'
      - 'Sources/AviationMCP/Data/SourceDiscovery.swift'
      - 'scripts/CheckSource.swift'
      - 'scripts/deployed-image.sh'
      - 'scripts/run-ingestion-job.sh'
      - 'scripts/ingest-checked-sources.sh'
      - '.github/scripts/ingestion-*'
  push:
    branches: [main]
    paths: *ingestion-paths
  schedule:
    # .github/scripts/ingestion-plan.cjs recognizes each run by these expressions.
    - cron: '17 */6 * * *'
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch ingestion even for releases an earlier run already published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('source-checks-{0}', github.ref) || 'source-ingestion' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      check: ${{ steps.decide.outputs.check }}
      ingest: ${{ steps.decide.outputs.ingest }}
      maintenance: ${{ steps.schedule.outputs.maintenance }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan this run
        id: schedule
        uses: actions/github-script@v9
        with:
          script: |
            const { plan } = require('./.github/scripts/ingestion-plan.cjs');
            const decision = plan({
              eventName: context.eventName,
              schedule: context.payload.schedule,
              now: Date.now(),
            });
            for (const [name, value] of Object.entries(decision)) core.setOutput(name, String(value));
      - name: Look up the polled DOF release
        id: published
        if: steps.schedule.outputs.dofRelease != ''
        uses: actions/cache/restore@v6
        with:
          path: reports/dof.json
          key: dof-published-${{ steps.schedule.outputs.dofRelease }}
          lookup-only: true
      - name: Skip polling for a published DOF release
        id: decide
        env:
          CHECK: ${{ steps.schedule.outputs.check }}
          INGEST: ${{ steps.schedule.outputs.ingest }}
          PUBLISHED: ${{ steps.published.outputs.cache-hit == 'true' }}
        run: |
          if [[ "$PUBLISHED" == true ]]; then
            CHECK=false INGEST=false
            printf 'The polled DOF release is already published.\n'
          fi
          { printf 'check=%s\n' "$CHECK"; printf 'ingest=%s\n' "$INGEST"; } >> "$GITHUB_OUTPUT"

  test-alerts:
    needs: plan
    if: needs.plan.outputs.check == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test .github/scripts/*.test.cjs

  check:
    needs: plan
    if: needs.plan.outputs.check == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [nasr, cifp, dof, aircraft]
    steps:
      - uses: actions/checkout@v7
      - name: Compile source checker
        run: >-
          swiftc Sources/AviationMCP/Data/SourceDiscovery.swift
          Sources/AviationMCP/Data/SourceChecks.swift scripts/CheckSource.swift
          -o /tmp/check-source
      - name: Check published releases
        env:
          SOURCE: ${{ matrix.source }}
        run: /tmp/check-source "$SOURCE" "$SOURCE.json"
      - uses: actions/upload-artifact@v7
        with:
          name: source-${{ matrix.source }}
          path: ${{ matrix.source }}.json
          retention-days: 1

  image:
    needs: plan
    if: needs.plan.outputs.ingest == 'true' || needs.plan.outputs.maintenance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reference: ${{ steps.serving.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the image the server runs
        id: serving
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_SERVER_API_TOKEN }}
        run: |
          reference=$(scripts/deployed-image.sh)
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  ingest:
    needs: [plan, check, test-alerts, image]
    if: >-
      ${{ always() && !cancelled() && needs.plan.outputs.ingest == 'true'
        && needs.test-alerts.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        source: [navigation, dof, aircraft]
    env:
      AVIATION_INGEST_IMAGE: ${{ needs.image.outputs.reference }}
      SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: source-*
          path: checked
          merge-multiple: true
      - name: Fingerprint the checked releases and parser image
        id: fingerprint
        run: |
          files=("checked/$SOURCE.json")
          if [[ "$SOURCE" == navigation ]]; then files=(checked/nasr.json checked/cifp.json); fi
          digest=$({ printf '%s\n' "$AVIATION_INGEST_IMAGE"; cat "${files[@]}" 2>/dev/null || true; } \
            | sha256sum | cut -d ' ' -f 1)
          printf 'key=ingested-%s-%s\n' "$SOURCE" "$digest" >> "$GITHUB_OUTPUT"
      - name: Reuse the results of an identical earlier publication
        id: published
        if: ${{ !inputs.force }}
        uses: actions/cache/restore@v6
        with:
          path: reports/${{ matrix.source }}.json
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Mark reused results
        if: steps.published.outputs.cache-hit == 'true'
        run: |
          jq 'map(.reused = true)' "reports/$SOURCE.json" > reused.json
          mv reused.json "reports/$SOURCE.json"
      - name: Dispatch available publications
        if: steps.published.outputs.cache-hit != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_INGEST_API_TOKEN }}
        run: bash scripts/ingest-checked-sources.sh "$SOURCE" checked "reports/$SOURCE.json"
      - name: Remember the published releases
        if: steps.published.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: reports/${{ matrix.source }}.json
          key: ${{ steps.fingerprint.outputs.key }}
      - name: Name the newest published DOF release
        id: dof
        if: matrix.source == 'dof' && steps.published.outputs.cache-hit != 'true'
        run: >-
          printf 'release=%s\n'
          "$(jq -r '[.[] | select(.status == "success") | .downloads[].cycle] | max // empty' reports/dof.json)"
          >> "$GITHUB_OUTPUT"
      - name: Stop polling for the published DOF release
        if: steps.dof.outputs.release != ''
        uses: actions/cache/save@v6
        with:
          path: reports/dof.json
          key: dof-published-${{ steps.dof.outputs.release }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ingestion-results-${{ matrix.source }}
          path: reports/*.json
          retention-days: 7

  terrain:
    needs: [plan, image]
    if: needs.plan.outputs.maintenance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate and publish terrain catalogs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_INGEST_API_TOKEN }}
          AVIATION_INGEST_IMAGE: ${{ needs.image.outputs.reference }}
        run: scripts/run-ingestion-job.sh import-terrain

  purge:
    needs: [plan, ingest, image]
    if: >-
      ${{ always() && !cancelled() && needs.plan.outputs.maintenance == 'true'
        && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Purge expired data and caches
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_INGEST_API_TOKEN }}
          AVIATION_INGEST_IMAGE: ${{ needs.image.outputs.reference }}
        run: scripts/run-ingestion-job.sh purge

  alert:
    needs: [plan, check, image, ingest, terrain, purge]
    if: ${{ always() && needs.plan.outputs.ingest == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: source-*
          path: checked
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: ingestion-results-*
          path: reports
          merge-multiple: true
      - name: Decide whether published coverage may have changed
        id: coverage
        env:
          MAINTENANCE: ${{ needs.plan.outputs.maintenance }}
        run: |
          refresh=$MAINTENANCE
          if jq -se 'flatten | any(.reused != true)' reports/*.json > /dev/null 2>&1; then
            refresh=true
          fi
          printf 'refresh=%s\n' "$refresh" >> "$GITHUB_OUTPUT"
      - name: Reuse the last published coverage
        id: cached-status
        if: steps.coverage.outputs.refresh != 'true'
        uses: actions/cache/restore@v6
        with:
          path: published-status.json
          key: published-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: published-status-
      - name: Inspect current and next published coverage
        id: status
        if: >-
          ${{ always() && (steps.coverage.outputs.refresh == 'true'
            || steps.cached-status.outputs.cache-matched-key == '') }}
        run: >-
          curl --fail --silent --show-error --max-time 60 --retry 2
          https://aviation-mcp.org/mcp
          --header 'Content-Type: application/json'
          --header 'Accept: application/json, text/event-stream'
          --data '{"jsonrpc":"2.0","id":"cycle-alert","method":"tools/call","params":{"name":"get_data_status"}}'
          --output published-status.json
      - name: Remember published coverage
        if: steps.status.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: published-status.json
          key: published-status-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Notify owner of failures, withheld releases and coverage gaps
        if: always()
        uses: actions/github-script@v9
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          INGEST_RESULT: ${{ needs.ingest.result }}
          TERRAIN_RESULT: ${{ needs.terrain.result }}
          PURGE_RESULT: ${{ needs.purge.result }}
        with:
          script: |
            const { notify } = require('./.github/scripts/ingestion-alerts.cjs');
            await notify({ github, context, core });
