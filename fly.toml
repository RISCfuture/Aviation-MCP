app = "aviation-mcp-server"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "35s"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ROLE = "serve"
  AVIATION_GROUPS = "airports,navigation,airspace,procedures,obstacles,aircraft,weather,notams,geography,status,terrain"
  PORT = "8080"
  MCP_ALLOWED_ORIGINS = "https://aviation-mcp.org"
  MCP_TIMEOUT_SECONDS = "30"
  PUBLIC_RATE_PER_MINUTE = "60"
  PUBLIC_RATE_BURST = "20"
  CONNECTOR_EGRESS_RANGES = "160.79.104.0/21"
  WEATHER_CACHE_SECONDS = "900"
  DATABASE_WAIT_SECONDS = "15"
  TERRAIN_CACHE_DIRECTORY = "/data/terrain"
  TERRAIN_CACHE_BYTES = "536870912"

[[mounts]]
  source = "terrain_cache"
  destination = "/data"
  scheduled_snapshots = false

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 30
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 8080
  path = "/metrics"
