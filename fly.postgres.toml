app = "aviation-mcp-db"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "120s"

[build]
  image = "flyio/postgres-flex:18"

[env]
  PRIMARY_REGION = "sjc"

[[mounts]]
  source = "pg_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5432
    handlers = ["pg_tls"]

  [services.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[checks.pg]
  port = 5500
  type = "http"
  interval = "15s"
  timeout = "10s"
  path = "/flycheck/pg"

[checks.role]
  port = 5500
  type = "http"
  interval = "15s"
  timeout = "10s"
  path = "/flycheck/role"

[checks.vm]
  port = 5500
  type = "http"
  interval = "15s"
  timeout = "10s"
  path = "/flycheck/vm"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 9187
  path = "/metrics"
